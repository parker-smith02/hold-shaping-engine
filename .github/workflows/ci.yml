name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (engine + server, incl. slow builds)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra server --extra dev
      - run: uv run ruff check .
      - name: Generated files are current
        run: |
          uv run python -m holdgen_server.codegen --check
          uv run python tools/gen_golden.py --check
      - run: uv run pytest -m "not e2e"

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  e2e:
    name: Editor end to end (Playwright)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra server --extra dev
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run pytest -m e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-builds
          path: /tmp/pytest-of-*/
          retention-days: 3
          if-no-files-found: ignore
